# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: IceCore Dynasty
email:
description: "IceCore Dynasty is a free fantasy hockey dynasty league built around permanent franchises, salary-cap management, live auctions, keepers, prospects and long-term franchise building."

github_username: icecoredynasty

url: "https://icecoredynasty.com"
baseurl: ""
repository: "icecoredynasty/icecoredynasty.github.io"

minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: icecore-post
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
  
atom_feed:
  hide: true

logo: "/assets/images/logo.png"
masthead_title: ""

footer:
  links:
    - label: Yahoo Fantasy
      icon: fas fa-hockey-puck
      url: https://hockey.fantasysports.yahoo.com/
      
    - label: Reddit
      icon: fab fa-reddit
      url: https://reddit.com/

    - label: Facebook
      icon: fab fa-facebook-f
      url: https://www.facebook.com/profile.php?id=61592652304764

    - label: Contact
      icon: fas fa-envelope
      url: mailto:commissioner@icecoredynasty.com

    - label: Legal
      icon: fas fa-scale-balanced
      url: /legal/

collections:

  teams:
    output: true
    permalink: /teams/:name/
    
