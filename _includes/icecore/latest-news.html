<section class="latest-news">

  <div class="section-heading">
    <h3>Latest from IceCore</h3>
  </div>

  <div class="latest-news__list">

    {% assign latest = site.posts | sort: "date" | reverse %}

    {% for post in latest limit: 4 %}

      <article class="latest-news__item">

        <a
          class="latest-news__link"
          href="{{ post.url | relative_url }}"
          aria-label="Read {{ post.title | escape }}"
        >

          <div class="latest-news__meta">

            <span>
              {{ post.date | date: "%b %d" | upcase }}
            </span>

            <span class="latest-news__dot">·</span>

            <span>
              {% if post.categories %}
                {{ post.categories | first | upcase }}
              {% else %}
                JOURNAL
              {% endif %}
            </span>

          </div>

          <div class="latest-news__row">

            <h4>{{ post.title }}</h4>

            <span class="latest-news__arrow">→</span>

          </div>

        </a>

      </article>

    {% endfor %}

  </div>

</section>
